<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUTECH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">EDUTECH</div>
        <ul class="nav-links">
            <li><a href="#home" class="nav-link" data-page="home">Home</a></li>
            <li><a href="#courses" class="nav-link" data-page="courses">Courses</a></li>
            <li><a href="#analytics" class="nav-link" data-page="analytics">Performance Analytics</a></li>
            <li><a href="#cart" class="nav-link" data-page="cart">Cart</a></li>
            <li><a href="#payment" class="nav-link" data-page="payment">Payment</a></li>
        </ul>
        <div class="nav-actions">
            <button id="loginBtn" class="btn login-btn">Login</button>
            <input type="text" id="searchInput" placeholder="Search courses...">
            <button id="searchBtn" class="btn search-btn">Search</button>
            <button id="filterBtn" class="btn filter-btn">Filter</button>
        </div>
    </nav>
    <main id="main-content">
        <!-- Dynamic content will be injected here by app.js -->
    </main>
    <div id="popup" class="popup"></div>
    <script src="app.js"></script>
</body>
</html>
